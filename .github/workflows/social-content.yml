name: Social Content Generator

on:
  schedule:
    - cron: '0 1 * * 1,3,5'  # 8:00 AM Vietnam (UTC+7), Thứ 2/4/6
  workflow_dispatch:           # Cho phép chạy thủ công từ GitHub UI

jobs:
  generate-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openai python-dotenv

      - name: Generate social content
        working-directory: ops/VenHoSocialManager
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_SENDER: ${{ secrets.SOCIAL_GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.SOCIAL_GMAIL_APP_PASS }}
          SKIP_GOOGLE_DRIVE: "1"
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_WEBHOOK_SECRET: ${{ secrets.MAKE_WEBHOOK_SECRET }}
        run: python3 generate_content.py --force

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ops/VenHoSocialManager/database/rotation_state.json \
                  ops/VenHoSocialManager/database/index.json \
                  ops/VenHoSocialManager/database/index.md \
                  'ops/VenHoSocialManager/database/**/*.json' \
                  'ops/VenHoSocialManager/database/**/*.txt'
          git diff --staged --quiet || git commit -m "chore: social content state [skip ci]"
          git push
