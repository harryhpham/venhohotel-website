name: Daily Revenue Report

on:
  schedule:
    - cron: '0 2 * * *'  # 9:00 AM Vietnam (UTC+7)
  workflow_dispatch:      # Cho phép chạy thủ công từ GitHub UI

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright openpyxl
          playwright install chromium --with-deps

      - name: Run revenue report
        env:
          SKYHOTEL_USER: ${{ secrets.SKYHOTEL_USER }}
          SKYHOTEL_PASS: ${{ secrets.SKYHOTEL_PASS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: python3 "ops/ai-agent/skyhotel-scraper.py"
