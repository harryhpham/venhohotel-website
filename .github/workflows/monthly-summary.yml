name: Monthly Summary Report

on:
  schedule:
    - cron: '0 3 1 * *'  # 10:00 AM Vietnam (UTC+7) ngày 1 mỗi tháng
  workflow_dispatch:      # Cho phép chạy thủ công để test

jobs:
  send-monthly-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright openpyxl
          playwright install chromium --with-deps

      - name: Run monthly report
        env:
          SKYHOTEL_USER: ${{ secrets.SKYHOTEL_USER }}
          SKYHOTEL_PASS: ${{ secrets.SKYHOTEL_PASS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: python3 "ops/ai-agent/skyhotel-scraper.py" --monthly
